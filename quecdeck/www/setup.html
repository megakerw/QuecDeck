<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <style>html,body{background:#0f1117}</style>
    <title>QuecDeck</title>
    <link rel="stylesheet" href="css/bootstrap.min.css?v=ee07dce6" />
    <link rel="stylesheet" href="css/styles.css?v=ee07dce6" />
    <link rel="icon" href="favicon.ico" />
    <script src="js/bootstrap.bundle.min.js?v=ee07dce6"></script>
    <script src="js/alpinejs.min.js?v=ee07dce6" defer></script>
  </head>
  <body>
    <main>
      <div class="container my-4" x-data="setupWizard()">
        <nav class="navbar navbar-expand-lg">
          <div class="container-fluid px-3">
            <span class="navbar-brand align-self-center">QuecDeck</span>
          </div>
        </nav>

        <div class="row gy-3 justify-content-center">
          <div class="col-sm-8 col-md-5 col-lg-4">
            <div class="panel-section">

              <!-- Step 1: Admin password -->
              <template x-if="step === 1">
                <div>
                  <h5 class="mb-2">Welcome</h5>
                  <p class="text-muted small mb-4">Set a password for the admin account to get started.</p>
                  <template x-if="error">
                    <div class="alert alert-danger mb-3" x-text="error"></div>
                  </template>
                  <form @submit.prevent="nextStep()">
                    <div class="mb-3">
                      <label class="form-label">Password</label>
                      <input type="password" class="form-control" x-model="adminPass" minlength="12" maxlength="256" autocomplete="new-password" autofocus required />
                    </div>
                    <div class="mb-0">
                      <label class="form-label">Confirm password</label>
                      <input type="password" class="form-control" x-model="adminPassConfirm" minlength="12" maxlength="256" autocomplete="new-password" required />
                    </div>
                    <button type="submit" class="btn btn-primary w-100 setup-actions" :disabled="submitting || !adminPass || !adminPassConfirm">Continue</button>
                  </form>
                </div>
              </template>

              <!-- Step 2: Developer password (required) -->
              <template x-if="step === 2">
                <div>
                  <h5 class="mb-2">Developer Access</h5>
                  <p class="text-muted small mb-4">Set a password for developer access. It is required and unlocks the AT terminal, cell locking, and SSH key management.</p>
                  <template x-if="error">
                    <div class="alert alert-danger mb-3" x-text="error"></div>
                  </template>
                  <form @submit.prevent="submit()">
                    <div class="mb-3">
                      <label class="form-label">Developer password</label>
                      <input type="password" class="form-control" x-model="devPass" minlength="12" maxlength="256" autocomplete="new-password" autofocus required />
                    </div>
                    <div class="mb-0">
                      <label class="form-label">Confirm password</label>
                      <input type="password" class="form-control" x-model="devPassConfirm" minlength="12" maxlength="256" autocomplete="new-password" required />
                    </div>
                    <div class="d-flex gap-2 setup-actions">
                      <button type="submit" class="btn btn-primary flex-fill" :disabled="submitting || !devPass || !devPassConfirm">
                        <span x-show="!submitting" x-cloak>Finish</span>
                        <span x-show="submitting" x-cloak>Setting up...</span>
                      </button>
                    </div>
                  </form>
                </div>
              </template>

            </div>
          </div>
        </div>
      </div>
    </main>
    <script src="js/capslock.js?v=ee07dce6"></script>
    <script src="js/setup.js?v=ee07dce6"></script>
  </body>
</html>
