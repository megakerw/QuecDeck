<!DOCTYPE html>
<html lang="en-GB" data-bs-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <style>html,body{background:#0f1117}</style>
    <title>QuecDeck</title>
    <link rel="stylesheet" href="css/bootstrap.min.css?v=9b50a139" />
    <link rel="stylesheet" href="css/styles.css?v=9b50a139" />
    <link rel="icon" href="favicon.ico" />
    <script src="js/bootstrap.bundle.min.js?v=9b50a139"></script>
    <script src="js/utils.js?v=9b50a139"></script>
    <script src="js/alpinejs.min.js?v=9b50a139" defer></script>
  </head>
  <body>
    <main>
      <div class="container my-4" x-data="quecdeckScheduledRestart()">
        <div id="nav-placeholder"></div>
        <script src="js/nav.js?v=9b50a139"></script>

        <div class="row gy-3 mt-4 mb-4 align-items-stretch">

          <!-- Scheduled Restart -->
          <div class="col-lg-8 col-xl-7 mx-auto">

            <div class="panel-section">
              <div class="panel-title d-flex justify-content-between align-items-center">
                <span>Scheduled Restart</span>
                <span
                  class="badge"
                  :class="srServiceActive ? 'text-bg-success' : 'text-bg-secondary'"
                  x-text="srServiceActive ? 'Active' : 'Inactive'"
                ></span>
              </div>

                <!-- Enable / Disable -->
                <div class="d-flex justify-content-between align-items-start mb-2">
                  <div>
                    <div class="fw-semibold mb-1" style="font-size: 0.875rem">Enable Scheduled Restart</div>
                    <div class="text-muted small" x-show="srEnabled" x-cloak>Reboots the modem on a schedule. The schedule waits until the device clock contains a plausible date and time.</div>
                    <div class="text-muted small" x-show="!srEnabled" x-cloak>Currently disabled.</div>
                  </div>
                  <div class="form-check form-switch ms-3">
                    <input class="form-check-input" type="checkbox" role="switch" x-model="srEnabled" />
                  </div>
                </div>

                <fieldset :disabled="!srEnabled" :style="!srEnabled ? 'opacity: 0.45' : ''">

                  <hr />

                  <!-- Frequency -->
                  <div class="mb-4">
                    <label class="form-label fw-semibold">Frequency</label>
                    <div class="d-flex gap-3">
                      <div class="form-check">
                        <input class="form-check-input" type="radio" id="srDaily" value="daily" x-model="srType" />
                        <label class="form-check-label" for="srDaily">Daily</label>
                      </div>
                      <div class="form-check">
                        <input class="form-check-input" type="radio" id="srWeekly" value="weekly" x-model="srType" />
                        <label class="form-check-label" for="srWeekly">Weekly</label>
                      </div>
                    </div>
                  </div>

                  <!-- Day of week (weekly only) -->
                  <div class="mb-4" x-show="srType === 'weekly'" x-cloak>
                    <label class="form-label fw-semibold">Day of Week</label>
                    <select class="form-select" x-model.number="srDay">
                      <option value="1">Monday</option>
                      <option value="2">Tuesday</option>
                      <option value="3">Wednesday</option>
                      <option value="4">Thursday</option>
                      <option value="5">Friday</option>
                      <option value="6">Saturday</option>
                      <option value="7">Sunday</option>
                    </select>
                  </div>

                  <hr />

                  <!-- Time -->
                  <div class="mb-3">
                    <label class="form-label fw-semibold">Time</label>
                    <input type="time" class="form-control input-mw-160" x-model="srTime" />
                    <div class="text-muted small mt-2">
                      The modem will restart at
                      <span x-text="String(srHour).padStart(2,'0') + ':' + String(srMinute).padStart(2,'0')"></span>
                      <span x-show="srType === 'weekly'" x-text="' every ' + ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'][srDay - 1]" x-cloak></span>
                      <span x-show="srType === 'daily'" x-cloak> every day</span>
                      (your local time).
                    </div>
                  </div>

                </fieldset>

              <div class="mt-auto pt-3">
                <button
                  type="button"
                  class="btn btn-primary"
                  @click="saveScheduledRestart()"
                  :disabled="srLoading || !srCanSave"
                  x-text="srLoading ? 'Saving...' : 'Save'"
                ></button>
                <span class="ms-3 text-muted small" x-text="srResponse"></span>
              </div>
            </div>

          </div>
        </div>
      </div>
    </main>
    <script src="js/scheduled-restart.js?v=9b50a139"></script>
  </body>
</html>
