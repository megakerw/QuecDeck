<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <style>html,body{background:#0f1117}</style>
    <title>QuecDeck</title>
    <link rel="stylesheet" href="css/bootstrap.min.css?v=93e14069" />
    <link rel="stylesheet" href="css/styles.css?v=93e14069" />
    <link rel="icon" href="favicon.ico" />
    <script src="js/bootstrap.bundle.min.js?v=93e14069"></script>
    <script src="js/alpinejs.min.js?v=93e14069" defer></script>
  </head>
  <body>
    <main>
      <div class="container my-4" x-data="loginPage()">
        <nav class="navbar navbar-expand-lg">
          <div class="container-fluid px-3">
            <span class="navbar-brand align-self-center">QuecDeck</span>
          </div>
        </nav>

        <div class="row gy-3 justify-content-center">
          <div class="col-sm-8 col-md-5 col-lg-4">
            <div class="panel-section">
              <h5 class="mb-3">Sign In</h5>

                <template x-if="expired">
                  <div class="alert alert-warning" role="alert">
                    Your session expired due to inactivity. Please sign in again.
                  </div>
                </template>
                <template x-if="passwordChanged">
                  <div class="alert alert-success" role="status">
                    Password changed. Sign in with your new password.
                  </div>
                </template>
                <template x-if="sessionWarning">
                  <div class="alert alert-warning" role="alert">
                    Complete sign-out of every previous session could not be confirmed.
                  </div>
                </template>
                <template x-if="locked">
                  <div class="alert alert-danger" role="alert">
                    Too many failed attempts. Try again in 15 minutes.
                  </div>
                </template>
                <template x-if="unavailable">
                  <div class="alert alert-danger" role="alert">
                    Password verification is temporarily unavailable. Please try again.
                  </div>
                </template>
                <template x-if="error">
                  <div class="alert alert-danger" role="alert">
                    Invalid username or password.
                  </div>
                </template>

                <form @submit.prevent="submitLogin($event)">
                  <div class="mb-0">
                    <label for="password" class="form-label">Password</label>
                    <input
                      type="password"
                      class="form-control"
                      id="password"
                      name="password"
                      autocomplete="current-password"
                      autofocus
                      required
                    />
                  </div>
                  <button type="submit" class="btn btn-primary w-100 setup-actions" :disabled="submitting">
                    <span x-show="!submitting" x-cloak>Sign In</span>
                    <span x-show="submitting" x-cloak>Signing in...</span>
                  </button>
                </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="js/capslock.js?v=93e14069"></script>
    <script src="js/login.js?v=93e14069"></script>
  </body>
</html>
