name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Test suite
        run: bash tests/host/run-tests.sh --slow

      - name: auth.lua tests
        run: |
          sudo apt-get install -y -qq lua5.1
          sudo bash tests/host/host-test-authlua.sh

      - name: Repository integrity checks
        run: bash tests/host/ci-checks.sh
